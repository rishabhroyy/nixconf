# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: rishabh-vm applications
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: portainer-provider
    identifiers:
      name: rishabh-vm Portainer
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: rishabh-vm-portainer
      client_secret: !Env [PORTAINER_OAUTH_CLIENT_SECRET, null]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://docker.rishabhroy.com/

  - model: authentik_core.application
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      provider: !KeyOf portainer-provider
      meta_launch_url: https://docker.rishabhroy.com

  - model: authentik_providers_proxy.proxyprovider
    id: copyparty-provider
    identifiers:
      name: rishabh-vm Copyparty
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://cloud.rishabhroy.com
      mode: forward_single
      skip_path_regex: |
        ^/share(?:/.*)?$

  - model: authentik_core.application
    identifiers:
      slug: copyparty
    attrs:
      name: Copyparty
      provider: !KeyOf copyparty-provider
      meta_launch_url: https://cloud.rishabhroy.com

  - model: authentik_providers_proxy.proxyprovider
    id: pyrodactyl-provider
    identifiers:
      name: rishabh-vm Pyrodactyl
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: https://games.rishabhroy.com
      mode: forward_single
      skip_path_regex: |
        ^/api/remote(?:/.*)?$

  - model: authentik_core.application
    identifiers:
      slug: pyrodactyl
    attrs:
      name: Pyrodactyl
      provider: !KeyOf pyrodactyl-provider
      meta_launch_url: https://games.rishabhroy.com

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf copyparty-provider
        - !KeyOf pyrodactyl-provider
