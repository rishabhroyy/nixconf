name: Update flake inputs

on:
  schedule:
    # Monday 7 AM Pacific (14:00 UTC)
    # Minute=0, Hour=14, Day=*, Month=*, Weekday=1(Monday)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Capture old revisions
        run: |
          nix flake metadata --json | jq -r '.locks.nodes | to_entries[] | select(.value.locked.rev?) | "\(.key) \(.value.locked.rev) \(.value.locked.type // "github"):\(.value.locked.owner // ""):\(.value.locked.repo // "")"' > /tmp/old-revs.txt || true

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes and build summary
        id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          nix flake metadata --json | jq -r '.locks.nodes | to_entries[] | select(.value.locked.rev?) | "\(.key) \(.value.locked.rev)"' > /tmp/new-revs.txt || true

          {
            echo 'summary<<EOSUMMARY'
            echo "## Updated inputs"
            echo ""
            while IFS=' ' read -r name old_rev extra; do
              new_rev=$(grep "^$name " /tmp/new-revs.txt | cut -d' ' -f2 || true)
              if [ -n "$new_rev" ] && [ "$old_rev" != "$new_rev" ]; then
                short_old="${old_rev:0:7}"
                short_new="${new_rev:0:7}"
                owner_repo=$(echo "$extra" | awk -F: '{if($2!="" && $3!="") print $2"/"$3}')
                if [ -n "$owner_repo" ]; then
                  echo "- **$name**: [\`$short_old\` → \`$short_new\`](https://github.com/$owner_repo/compare/$old_rev...$new_rev)"
                else
                  echo "- **$name**: \`$short_old\` → \`$short_new\`"
                fi
              fi
            done < /tmp/old-revs.txt
            echo 'EOSUMMARY'
          } >> "$GITHUB_OUTPUT"

      - name: Build patched QEMU
        if: steps.diff.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.rishabh-nix.config.virtualisation.libvirtd.qemu.package --no-link

      - name: Build patched OVMF
        if: steps.diff.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.rishabh-nix.pkgs.ovmf_win11 --no-link

      - name: Build full system closure
        if: steps.diff.outputs.changed == 'true'
        id: build
        run: |
          if nix build .#nixosConfigurations.rishabh-nix.config.system.build.toplevel --no-link 2>&1; then
            echo "result=✅ Full system build succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ Full system build failed (QEMU/OVMF patches may have passed but another package broke)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/flake-update
          delete-branch: true
          title: "flake.lock: update inputs"
          body: |
            ${{ steps.diff.outputs.summary }}

            ## Build verification
            - ✅ Patched QEMU compiled (substituteInPlace targets still match upstream)
            - ✅ Patched OVMF compiled (ACPI OEM ID patches still match upstream)
            - ${{ steps.build.outputs.result }}

            > ⚠️ Build verification confirms patches apply and compile. Runtime VFIO behavior can only be verified on the actual host.
          commit-message: "flake.lock: update inputs"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
